<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />

<title>Untitled 1</title>


<!--
	how to run?
		query.html?param1=value1&param2=value2
		http://localhost/query.html?param1=value1&param2=value2

-->


<script type="text/javascript">

function test () {
	var value1 = '';
	var queryDict = {};
	location.search.substr(1).split("&").forEach(function(item) {queryDict[item.split("=")[0]] = item.split("=")[1]}) 
	
	for (key in queryDict) {
		value1 += key + ' : ' + queryDict[key] + "<br>\n";
	
	}
	document.getElementById('here1').innerHTML = value1;
}

</script>

</head>

<body>

<div id="here1">original</div>

<form method="post">
	<input id="button1" name="Button1" type="button" value="Check Query String" onclick="test()" /></form>

</body>

</html>
