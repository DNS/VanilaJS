<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Weather API</title>
</head>
<body>

	<h2>Weather</h2>
	<div id="weather-container">Loading data...</div>

	<hr />

	<h2>IP Location</h2>
	<div id="iplocation-container">Loading data...</div>

	<script>
		const latitude  = '-6.175096228258444';
		const longitude = '106.82788563400537';

		async function loadWeather() {
			const displayDiv = document.getElementById('weather-container');
			
			try {
				// Fetching data from a free public REST API
				const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
				
				// Check if the response is successful (status 200-299)
				if (!response.ok) {
					throw new Error(`HTTP error! status: ${response.status}`);
				}

				// Parse the JSON body of the response
				const data = await response.json();

				// Display the specific pieces of data inside the div
				displayDiv.innerHTML = `
					<div><strong>Time:</strong> ${data.current_weather.time}</div>
					<div><strong>Temperature:</strong> ${data.current_weather.temperature}</div>
					<div><strong>Windspeed:</strong> ${data.current_weather.windspeed}</div>
					<div><strong>Wind Direction:</strong> ${data.current_weather.winddirection}</div>
					<div><strong>Latitude:</strong> ${data.latitude}</div>
					<div><strong>Longitude:</strong> ${data.longitude}</div>
					<div><strong>Elevation:</strong> ${data.elevation}</div>
				`;
			} catch (error) {
				// Handle any errors (network issues, 404s, etc.)
				console.error('Fetch error:', error);
				displayDiv.innerHTML = 'Failed to get weather data.';
			}
		}

		async function loadIPlocation() {
			const displayDiv = document.getElementById('iplocation-container');
			
			try {
				// Fetching data from a free public REST API
				const ip_location = await fetch('https://ip.app/whereami?format=json');
				const user_agent = await fetch('https://ip.app/ua?format=json');
				
				// Check if the response is successful (status 200-299)
				if (!ip_location.ok) {
					throw new Error(`HTTP error! status: ${ip_location.status}`);
				}

				if (!user_agent.ok) {
					throw new Error(`HTTP error! status: ${user_agent.status}`);
				}

				// Parse the JSON body of the response
				const ip_location_json = await ip_location.json();
				const ua_json = await user_agent.json();

				// Display the specific pieces of data inside the div
				displayDiv.innerHTML = `
					<div><strong>IP Location:</strong> ${ip_location_json.location.lat}, ${ip_location_json.location.lng}</div>
					<div><strong>User Agent:</strong> ${ua_json.ua}</div>
				`;
			} catch (error) {
				// Handle any errors (network issues, 404s, etc.)
				console.error('Fetch error:', error);
				displayDiv.innerHTML = 'Failed to get IP location data.';
			}
		}

		// Call the function immediately when the script loads
		loadWeather();
		loadIPlocation();
	</script>

</body>
</html>
